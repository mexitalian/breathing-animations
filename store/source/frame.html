<!doctype html><meta charset="utf-8">
<!-- Store screenshot frame: caption over a phone-sized capture. Rendered at 1080×1920
     with ?h=<hue>&t=<title>&s=<subtitle>&img=<capture.png>; see store/README.md. -->
<style>
@font-face{font-family:Roboto;font-weight:300;src:url(/__fonts/roboto-latin-300-normal.woff2)}
@font-face{font-family:Roboto;font-weight:400;src:url(/__fonts/roboto-latin-400-normal.woff2)}
@font-face{font-family:Roboto;font-weight:500;src:url(/__fonts/roboto-latin-500-normal.woff2)}
html,body{margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Roboto,sans-serif;color:#f2f1f7;
  background:radial-gradient(120% 70% at 50% 0%, oklch(0.32 0.07 var(--h)) 0%, oklch(0.16 0.03 var(--h)) 70%);
  display:flex;flex-direction:column;align-items:center}
.cap{padding:110px 90px 0;text-align:center;display:flex;flex-direction:column;gap:22px;height:250px}
h1{margin:0;font-weight:500;font-size:74px;letter-spacing:-0.01em;line-height:1.05;text-wrap:balance}
p{margin:0;font-weight:300;font-size:38px;line-height:1.3;color:oklch(0.85 0.03 var(--h));text-wrap:balance}
.phone{margin-top:70px;height:1490px;aspect-ratio:1081/2343;border-radius:56px;overflow:hidden;
  box-shadow:0 0 0 10px oklch(0.24 0.02 var(--h)),0 0 0 12px oklch(0.4 0.03 var(--h) / .6),0 40px 120px rgb(0 0 0/.55)}
.phone img{width:100%;display:block}
</style>
<div class=cap><h1 id=title></h1><p id=sub></p></div><div class=phone><img id=img></div>
<script>
const q=new URLSearchParams(location.search);
document.body.style.setProperty('--h',q.get('h'));
title.textContent=q.get('t');sub.textContent=q.get('s');img.src=q.get('img');
</script>
