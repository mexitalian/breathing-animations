<!doctype html><meta charset="utf-8">
<!-- Google Play feature graphic, 1024×500. -->
<style>
@font-face{font-family:Roboto;font-weight:300;src:url(/__fonts/roboto-latin-300-normal.woff2)}
@font-face{font-family:Roboto;font-weight:500;src:url(/__fonts/roboto-latin-500-normal.woff2)}
html,body{margin:0}
body{width:1024px;height:500px;overflow:hidden;font-family:Roboto,sans-serif;color:#f2f1f7;
  background:radial-gradient(90% 120% at 25% 50%, #2e2550 0%, #15122a 60%, #0e0c1c 100%);
  display:flex;align-items:center;gap:48px;padding:0 56px;box-sizing:border-box}
svg{flex:none}
.text{display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-weight:500;font-size:68px;letter-spacing:-0.01em}
p{margin:0;font-weight:300;font-size:30px;color:#c9c3e6;line-height:1.3}
</style>
<svg width="460" height="300" viewBox="0 0 460 300">
  <defs>
    <radialGradient id="g1" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#c9a8f0"/><stop offset="1" stop-color="#7c78e0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <!-- square, circle, triangle: the three session shapes -->
  <rect x="8" y="95" width="110" height="110" rx="4" fill="#5fc6cf" opacity=".25" filter="url(#glow)"/>
  <rect x="8" y="95" width="110" height="110" rx="4" fill="#5fc6cf"/>
  <circle cx="230" cy="150" r="80" fill="#8f7fe8" opacity=".35" filter="url(#glow)"/>
  <circle cx="230" cy="150" r="92" fill="none" stroke="#b7aee0" stroke-opacity=".45" stroke-width="3"/>
  <circle cx="230" cy="150" r="66" fill="url(#g1)"/>
  <path d="M390 95 L452 205 L328 205 Z" fill="#e8907a" opacity=".3" filter="url(#glow)"/>
  <path d="M390 95 L452 205 L328 205 Z" fill="#e8907a"/>
</svg>
<div class="text"><h1>Breath Shape</h1><p>Guided breathing exercises.<br>Follow the shape, settle body and mind.</p></div>
